<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hindsight</title>
<style>
:root{
  --ink:#1d1a16; --paper:#fbf6ea; --gold:#c9932f; --muted:#7a6f5d;
  --panel:#fffaf0; --line:#e3d7bd; --bug:#b8432f; --update:#2f7a55; --invest:#2d5f9a; --frame:#7c4dab;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#f3ead6; --paper:#16130f; --panel:#221d17; --line:#3d3428; --muted:#b3a68d; }
}
:root[data-theme="dark"]{ --ink:#f3ead6; --paper:#16130f; --panel:#221d17; --line:#3d3428; --muted:#b3a68d; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.45 Georgia,"Iowan Old Style",serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;flex-wrap:wrap;right:12px;pointer-events:none}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;box-shadow:0 2px 8px #0002;cursor:pointer;color:var(--ink)}
.chip b{color:var(--gold)}
.title{font-weight:bold;letter-spacing:.04em;cursor:default}
.prompt{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;font-size:14px;display:none;box-shadow:0 4px 16px #0003;cursor:pointer;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame{position:fixed;inset:auto 16px 16px 16px;max-width:520px;margin:0 auto;max-height:70vh;overflow:auto;background:var(--panel);border:10px solid #8a6a3a;outline:2px solid var(--gold);outline-offset:-6px;border-radius:6px;padding:18px 18px 14px;display:none;box-shadow:0 10px 40px #0006}
.frame .kind{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:bold}
.frame h2{margin:4px 0 6px;font-size:19px;line-height:1.25}
.frame .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
.frame p{margin:0 0 10px;white-space:pre-wrap}
.frame a{color:var(--invest);word-break:break-all}
.frame .row{display:flex;gap:8px;justify-content:space-between;margin-top:8px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.journal{position:fixed;inset:max(56px,calc(env(safe-area-inset-top) + 48px)) 16px 16px 16px;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:none;flex-direction:column;box-shadow:0 10px 40px #0006}
.journal header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.journal header h3{margin:0 auto 0 0;font-size:16px}
.journal .list{overflow:auto;padding:4px 0}
.journal .it{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.journal .it:hover{background:#c9932f18}
.journal .it .d{color:var(--muted);font-size:12px;min-width:52px}
.journal .it .s{margin-left:auto;font-size:12px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:var(--paper)}
.k-update{color:var(--update)} .k-bug{color:var(--bug)} .k-invest{color:var(--invest)} .k-frame{color:var(--frame)} .k-final{color:var(--gold)}
@media (max-width:440px){ .chip{padding:5px 9px;font-size:12px} .wide{display:none} }
.toast{position:fixed;left:50%;top:max(104px,calc(env(safe-area-inset-top) + 96px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <span class="chip title">🐔 HINDSIGHT</span>
  <span class="chip" id="seen" title="Open the journal">Looked at <b id="seenN">0</b>/<b id="allN">0</b></span>
  <span class="chip" id="jbtn">Journal<span class="wide"> (J)</span></span>
  <span class="chip" id="clock">Day</span>
</div>
<div class="prompt" id="prompt"></div>
<div class="frame" id="frame" role="dialog" aria-modal="true">
  <div class="kind" id="fKind"></div>
  <h2 id="fTitle"></h2>
  <div class="meta" id="fMeta"></div>
  <div id="fBody"></div>
  <div class="row"><button class="btn ghost" id="fPrev">‹ Back in time</button><button class="btn" id="fClose">Close</button><button class="btn ghost" id="fNext">Forward ›</button></div>
</div>
<div class="journal" id="journal">
  <header><h3>Journal</h3>
    <button class="tab on" data-f="all">All</button><button class="tab" data-f="update">Updates</button><button class="tab" data-f="bug">Bugs</button><button class="tab" data-f="invest">Investors</button><button class="tab" data-f="frame">Frames</button><button class="tab" data-f="unseen">Not seen</button>
    <button class="btn ghost" id="jClose">✕</button></header>
  <div class="list" id="jList"></div>
</div>
<div class="toast" id="toast"></div>

<!-- The world. tools/build-world.mjs replaces this block with a real world (e.g. LAIFE's history). -->
<script id="world-data" type="application/json">
{"title":"Hindsight","subtitle":"Demo world: the game's own history","final":{"title":"The Final Update","body":"You walked the whole road. Every update, every bug, every investor note sits behind you now, looked at in hindsight.\n\nThis lighthouse is the last stop. The private build fills this world with the real history."},"updates":[{"d":"2026-11-13","tag":"v1","t":"Hindsight is born: a road through time","why":"Every update becomes a house, every bug a beetle, every investor note a market stall."},{"d":"2026-11-13","tag":"v1","t":"Chickens move in","why":"The world should feel alive: hens wander, peck and gossip about what they saw."},{"d":"2026-11-13","tag":"v1","t":"Day and night","why":"Time passes while you walk. Windows light up after dark."},{"d":"2026-11-13","tag":"v1","t":"The journal","why":"Nothing is missed: every item is listed, ticked when you look at it."},{"d":"2026-11-13","tag":"v1","t":"Hindsight Hall and its frames","why":"The how-it-works guide and the Opus cheat sheet hang on the walls."},{"d":"2026-11-13","tag":"v1","t":"The lighthouse: the final update","why":"The road ends somewhere. The last stop counts everything you looked at."}],"bugs":[{"d":"2026-11-13","app":"Hindsight v1","t":"The repo was empty: no game to add to","reached":"No","fix":"Built the game from scratch in Gamgam."},{"d":"2026-11-13","app":"Hindsight v1","t":"Private history can't live in a public repo","reached":"No","fix":"Public repo ships a demo world; the real one is built into the private repo."}],"investors":[{"d":"2026-11-13","t":"Investor desk is empty in the public demo","src":"","kind":"note"}],"frames":[{"title":"What Hindsight is","body":"- A small browser game: one page, one file, drawn on a canvas.\n- You are a crowned chicken walking a road through time.\n- Every update is a house, every bug is a beetle, every investor note is a market stall.\n- They sit along the road in date order, with a signpost at each new date.\n- Hindsight Hall stands at the start of the road and holds framed docs. This text is one of them.\n- A lighthouse called The Final Update stands at the far end.\n- The aim is simple: walk the road and look at everything."},{"title":"Controls","body":"- Walk: arrow keys or W A S D. Hold Shift to run.\n- Look at the nearest thing: E, Space or Enter. A gold dashed ring shows what is nearest.\n- Journal: J opens and closes it.\n- Escape closes the open picture and the journal.\n- Tap or click the ground to walk there.\n- Tap a thing to walk to it and open it. If you are already close, it opens at once.\n- Tap the prompt at the bottom of the screen to open what it names.\n- Inside a picture: \"Back in time\" and \"Forward\" step through everything in order and move you there. \"Close\" shuts it."},{"title":"What you see on the road","body":"- Houses (updates) stand above the road in two rows. The label under a house is its tag. Roof colour follows the tag.\n- Beetles (bugs) wander below the road. A bug that reached the phone is drawn bigger.\n- Stalls (investor notes) line the market strip at the top.\n- Open one and you get its date, its tag and its details: the why for an update, the cause and fix for a bug, a source link where one exists.\n- Once looked at, a house flag turns green, a beetle goes pale and settles with a tick, a stall shows a tick.\n- The strip along the bottom is a map of the whole road: one mark per thing, green when seen, and a dot for you."},{"title":"The journal and the count","body":"- The chip at the top reads \"Looked at N/M\". M is every house, beetle, stall, frame and the lighthouse.\n- The journal lists all of them with a date and a tick once seen.\n- Tabs filter the list: All, Updates, Bugs, Investors, Frames, Not seen.\n- Tap a row to jump straight there and open it.\n- What you have seen is saved in the browser, so it survives a reload when storage works.\n- When the last one is ticked a message says nothing was missed."},{"title":"A living world","body":"- A full day lasts three minutes. The chip at the top shows Day or Night.\n- After dark the sky dims, stars come out, house windows glow and the lighthouse beam grows brighter.\n- Butterflies fly by day and fireflies by night. Clouds drift and the grass sways.\n- Hens wander, peck and sometimes follow you. There are at least ten, more in a big world.\n- Hens gossip in speech bubbles about things near them, such as \"In hindsight…\" followed by an update's name, or \"Bug over there!\" for a bug you have not looked at.\n- The world is laid out from a fixed seed, so it looks the same on every visit."},{"title":"Hindsight Hall and the lighthouse","body":"- The hall is the purple-roofed building left of the start. Its frames are numbered and hang five to a row.\n- Each frame is one section of a markdown doc: the section heading is the title, the rest is the text.\n- An empty hall shows a note saying the frames arrive with the cheat sheet.\n- The lighthouse is the last stop on the road. Opening it shows the closing words, how many updates, bugs, investor notes and frames are on the road, and how many you have looked at."},{"title":"The world data block","body":"- The page holds one block of JSON in a script tag with the id world-data.\n- The game reads it once at start-up and builds everything from it.\n- It holds a title, a subtitle, the final text for the lighthouse, and four lists: updates, bugs, investors, frames.\n- Swap the block and you get a different world. No other part of the page changes.\n- The page in the repo carries a small demo world about the game's own history."},{"title":"How the builder makes a world","body":"- tools/build-world.mjs is a Node script. It takes index.html as the template and writes a new page with the data block replaced.\n- Given a LAIFE checkout it reads three files. Any that are missing are skipped.\n- CHANGELOG.md: each starred line that starts with a date, with parts split by a middle dot, becomes an update (date, tag, what, why).\n- brain/dev/Bug log.md: each table row that starts with a date becomes a bug (date, app, bug, reached the phone, cause and fix).\n- apps/life/invest-seed.json: the rule, the split note, the growth note, the ANT status and news, and the how-to and guard notes each become an investor note.\n- It prints how many of each it found."},{"title":"How markdown becomes frames","body":"- Pass --frames followed by a markdown file. You can pass it more than once; frames keep that order.\n- The file is cut at every line that starts with two hashes and a space.\n- Each cut is one frame. Its first line is the title and everything after is the body.\n- Anything before the first such heading, like the main title and intro line, is left out.\n- Bold marks and backticks are removed. The body is shown as plain text with its line breaks kept.\n- So each section should be short and make sense on its own."},{"title":"Public demo and private build","body":"- The public repo holds the game, the builder and these docs. Its world is the demo, with nothing private in it.\n- A demo build (the --demo flag) keeps the demo world from index.html and only swaps in the frames you pass.\n- A private build points the builder at a LAIFE checkout and fills the road with the real history. Its title becomes \"Hindsight · LAIFE\".\n- The private page is still one self-contained file, so it can be opened anywhere.\n- That page must stay private. It is never committed to the public repo."},{"title":"File map","body":"- index.html: the whole game. Styles, markup, the world-data JSON block and one script. No libraries, no network calls. It is also the builder's template.\n- tools/build-world.mjs: Node script that writes a page with a new world in it. It reads index.html from the repo root, wherever you run it from.\n- docs/HOW-IT-WORKS.md and docs/OPUS-CHEATSHEET.md: these docs. Each \"## \" section becomes one frame in Hindsight Hall.\n- tests/check.mjs: the checks. Run them after every change.\n- Script order in index.html: world build, seen store, living things, input, frame panel, journal, gossip, time and update, drawing, loop."},{"title":"World data schema","body":"- Top level: title, subtitle, final, updates, bugs, investors, frames.\n- title is also part of the seen-store key. subtitle is stored but the game never shows it.\n- final: title and body, shown at the lighthouse.\n- updates: d (date as YYYY-MM-DD), tag (label under the house, also picks the roof colour), t (title), why. An optional src is shown as a link if present.\n- bugs: d, app (shown as the tag), t (title), reached (starts with \"yes\" means a big beetle), fix.\n- investors: d, t (title), src (link, may be empty), kind (shown as the tag).\n- frames: title, body. No date.\n- Missing lists are treated as empty."},{"title":"Where things are placed","body":"- All layout is in the block headed \"build the world\" near the top of the script.\n- items = updates, bugs and investors, sorted by date, then update, invest, bug, then original order.\n- x starts at 200. Each item moves on 74.4 (SLOT times 0.62). A new date adds a gap of 60 and a signpost.\n- y by kind, with ROAD at 0: updates alternate 130 and 250 above the road, bugs alternate 130 and 230 below, investors all sit 390 above.\n- HALL_X is -420. Frames hang on two rows of COLS (at least 5), 75 apart, centred on the hall; HALL_W grows to fit them.\n- END_X is the last x plus 260. The lighthouse stands there.\n- all = frames, items, lighthouse. Each gets an id of kind, colon, index."},{"title":"Where things are drawn","body":"- draw() runs every frame: sky, clouds, stars, grass, market strip, road, signposts, hall, frames, lighthouse, then items and chickens sorted by y, then flies, the near ring, night tint and the bottom timeline.\n- house(o, L) draws an update, beetle(o) a bug, stall(o) an investor note. The switch between them is the \"draws\" list inside draw().\n- chicken() draws both hens and the hero. label() and bubble() draw text.\n- The hall, the frames and the lighthouse are drawn inline in draw(), not in their own functions.\n- update(dt) moves the hero, hens, bugs and clouds, finds the nearest thing and sets the Day or Night chip.\n- openFrame(o) fills the detail panel. drawJournal() fills the journal."},{"title":"Adding a new kind of thing","body":"- Add its list to the world data and a parser to the builder, then add the list to the world object there.\n- Push it into items in the world-build block with a new kind name.\n- Add the kind to the order and lane maps, and give it a y in the placement loop.\n- Add it to KIND (label and CSS class) and add a k- colour class in the styles.\n- Write a draw function and add it to the switch in draw().\n- Show its fields in openFrame().\n- Add a journal tab button with data-f set to the kind.\n- Add a colour for it in the timeline strip and a line in gossip().\n- Add its count to the lighthouse summary and to the builder's log line.\n- Extend tests/check.mjs."},{"title":"How seen is stored and counted","body":"- seen is a Set of ids such as update:3, bug:0, invest:2, frame:5 and final:N.\n- It is saved to localStorage under the key hindsight.seen. plus the world title, a dot, and the number of things in all.\n- So ticks reset when the title changes or anything is added or removed. That is on purpose: ids are indexes, and old ticks would point at the wrong things.\n- Reordering without changing the count would still mis-tick. Avoid it, or change the title.\n- An id is added in openFrame(), then saveSeen() and updCount() run.\n- The count covers frames, items and the lighthouse. The hall itself is not lookable.\n- Storage reads and writes sit in try/catch, so the game still runs without storage."},{"title":"Rebuild and test commands","body":"- Run from the repo root, because --frames paths are resolved from the current folder.\n- Public demo with both docs as frames:\n  node tools/build-world.mjs --demo index.html --frames docs/HOW-IT-WORKS.md --frames docs/OPUS-CHEATSHEET.md\n- Writing the demo over index.html is safe: only the data block is replaced, so it still works as the template.\n- Private build, written outside this repo:\n  node tools/build-world.mjs LAIFE-DIR OUT.html --frames docs/HOW-IT-WORKS.md --frames docs/OPUS-CHEATSHEET.md\n- Read the log line it prints: updates, bugs, investor notes, frames. A zero usually means a wrong path.\n- Test after every change and every rebuild:\n  node tests/check.mjs"},{"title":"Gotchas in the builder","body":"- The data block is swapped in with a function passed to String.replace. A plain string would read a dollar sign and digit in the data as a pattern and corrupt it. Keep the function.\n- Every \"\u003c\" in the JSON is written as \\u003c so data can never close the script tag early. Keep that too.\n- A missing source file or frames file is skipped silently. Check the counts.\n- Dates must look like 24 Oct 2026. Lines and rows without one are dropped.\n- The private lighthouse text is hard-coded in the builder, not read from LAIFE.\n- Frames lose bold marks and backticks. Links, tables and code fences show as raw text.\n- The parsers are exported, but importing the file also runs a build. With no output path it exits with code 1."},{"title":"Gotchas in the game","body":"- Keep it one self-contained file: no imports, no fonts, no fetches.\n- Text goes in with textContent, never innerHTML. Keep it that way, as the data is not trusted markup.\n- src is used as a link target as it stands, so only build from data you trust.\n- Frames hang on two rows; the hall grows wider (COLS, HALL_W) as frames are added, never taller, so they never climb the roof.\n- The lighthouse label is drawn from final.title, in capitals.\n- For poking at a running world, window.__hindsight holds W, items, frames, all, seen, hero and openFrame.\n- rnd() is seeded and also used at run time. The order of calls during set-up decides how the world looks.\n- Items with no date sort to the start of the road."},{"title":"Before you ship","body":"- Public repo: no LAIFE content anywhere. No real names, money, health, appointments or plans in index.html, docs, tests or commit messages.\n- Never commit a page built from LAIFE to the public repo.\n- Each doc starts with one \"# \" title and a one-line intro. Every \"## \" section is plain, short and makes sense on its own.\n- Rebuild the demo so the frames match the docs, and check the frame count in the log.\n- Run node tests/check.mjs and see it pass.\n- Open the page: walk, tap, open one of each kind, open the journal, reach the lighthouse.\n- Check a narrow phone-sized window as well.\n- Confirm the \"Looked at\" count reaches its total."}]}
</script>

<script>
(()=>{
"use strict";
const W = JSON.parse(document.getElementById("world-data").textContent);
const cv = document.getElementById("c"), cx = cv.getContext("2d");
let VW=0, VH=0, DPR=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); VW=innerWidth; VH=innerHeight; cv.width=VW*DPR; cv.height=VH*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();

/* ---------- random with a seed, so the world looks the same every visit ---------- */
let seed=1234567; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=d=>{ const [y,m,dd]=String(d||"").split("-"); return m?`${+dd} ${MONTHS[+m-1]} ${y}`:(d||""); };

/* ---------- build the world: one slot per item, in date order ---------- */
const ROAD=0, SLOT=120;
const items=[];
(W.updates||[]).forEach((u,i)=>items.push({kind:"update",d:u.d,title:u.t,tag:u.tag,why:u.why,src:u.src,i}));
(W.bugs||[]).forEach((b,i)=>items.push({kind:"bug",d:b.d,title:b.t,tag:b.app,reached:b.reached,fix:b.fix,i}));
(W.investors||[]).forEach((v,i)=>items.push({kind:"invest",d:v.d,title:v.t,tag:v.kind,src:v.src,i}));
const order={update:0,invest:1,bug:2};
items.sort((a,b)=>(a.d||"").localeCompare(b.d||"")||order[a.kind]-order[b.kind]||a.i-b.i);

// each product gets its own roof colour: the heart red, the plan blue, the rest from their name
function hueFor(tag){ tag=String(tag||""); if(/claude|heart|^v\d/i.test(tag)) return 8; if(/plan/i.test(tag)) return 212; if(/question|fix/i.test(tag)) return 40;
  const name=tag.replace(/\s*v?\d.*$/,"").toLowerCase()||"x"; let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))%360; return h; }
const HALL_X=-420;
let x=200, lastD=null; const signs=[];
const lane={update:0,bug:0,invest:0};
for(const it of items){
  if(it.d!==lastD){ if(lastD!==null) x+=60; signs.push({x:x-50,d:it.d}); lastD=it.d; }
  it.x=x;
  const n=lane[it.kind]++;
  if(it.kind==="update"){ it.y=ROAD-(n%2?250:130); }
  else if(it.kind==="bug"){ it.y=ROAD+(n%2?230:130); it.big=/^yes/i.test(it.reached||""); it.home={x:it.x,y:it.y}; it.vx=0; it.vy=0; it.t=rnd()*9; }
  else { it.y=ROAD-390; }
  it.hue=it.kind==="update"?hueFor(it.tag):0;
  it.seed=rnd();
  x+=SLOT*0.62;
}
const END_X=x+260;
// frames hang on two rows inside the hall; the hall grows wider, never taller, so frames never climb the roof
const frames=(W.frames||[]).map((f,i)=>({kind:"frame",d:"",title:f.title,body:f.body,i}));
const COLS=Math.max(5,Math.ceil(frames.length/2)), HALL_W=Math.max(460,COLS*75+80);
frames.forEach((f,i)=>{ f.x=HALL_X-(COLS-1)*75/2+(i%COLS)*75; f.y=ROAD-120-Math.floor(i/COLS)*95; });
const lighthouse={kind:"final",title:(W.final&&W.final.title)||"The Final Update",body:(W.final&&W.final.body)||"",x:END_X,y:ROAD-150,d:""};
const hall={kind:"hall",title:"Hindsight Hall",x:HALL_X,y:ROAD-150};
const all=[...frames,...items,lighthouse];
all.forEach((o,i)=>o.id=o.kind+":"+(o.i??i));

/* ---------- what's been looked at (per viewer, survives reloads when storage works) ---------- */
const KEY="hindsight.seen."+(W.title||"")+"."+all.length;
let seen=new Set(); try{ seen=new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }catch(e){}
const saveSeen=()=>{ try{ localStorage.setItem(KEY,JSON.stringify([...seen])); }catch(e){} };
const countable=all.filter(o=>o.kind!=="hall");
function updCount(){ document.getElementById("seenN").textContent=countable.filter(o=>seen.has(o.id)).length; document.getElementById("allN").textContent=countable.length; }
updCount();

/* ---------- the living things ---------- */
const hero={x:HALL_X+HALL_W/2+120,y:ROAD+10,tx:null,ty:null,dir:1,step:0,peck:0};
const hens=[]; for(let i=0;i<Math.max(10,Math.floor(items.length/5));i++){ const hx=HALL_X+rnd()*(END_X-HALL_X); hens.push({x:hx,y:ROAD+(rnd()*2-1)*80,dir:rnd()<.5?-1:1,step:0,peck:0,tx:hx,ty:ROAD,wait:rnd()*4,col:["#f3efe6","#c9772b","#5a3b22","#e8d9b0"][Math.floor(rnd()*4)],say:"",sayT:0}); }
const clouds=[]; for(let i=0;i<14;i++) clouds.push({x:HALL_X+rnd()*(END_X-HALL_X+800),y:-700+rnd()*260,s:.6+rnd()*1.2,v:6+rnd()*10});
const flies=[]; for(let i=0;i<26;i++) flies.push({x:HALL_X+rnd()*(END_X-HALL_X),y:ROAD+(rnd()*2-1)*300,p:rnd()*7});
const tufts=[]; for(let gx=HALL_X-600;gx<END_X+600;gx+=38) for(let k=0;k<3;k++){ const gy=(rnd()*2-1)*520; if(Math.abs(gy-ROAD)>40) tufts.push({x:gx+rnd()*30,y:gy,p:rnd()*6}); }

/* ---------- input ---------- */
const keys={}; addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT")return; keys[e.key.toLowerCase()]=true;
  if(e.key==="Escape"){ closeFrame(); closeJournal(); }
  if((e.key===" "||e.key==="Enter"||e.key.toLowerCase()==="e")&&!frameOpen&&!journalOpen&&near){ e.preventDefault(); openFrame(near); }
  if(e.key.toLowerCase()==="j"){ journalOpen?closeJournal():openJournal(); }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
const cam={x:hero.x,y:hero.y};
const zoom=()=>VW<600?0.8:1;
function toWorld(px,py){ const z=zoom(); return {x:(px-VW/2)/z+cam.x,y:(py-VH/2)/z+cam.y}; }
cv.addEventListener("pointerdown",e=>{
  if(frameOpen||journalOpen) return;
  const p=toWorld(e.clientX,e.clientY);
  const hit=all.find(o=>Math.abs(o.x-p.x)<40&&Math.abs(o.y-p.y)<44) || (Math.abs(lighthouse.x-p.x)<50&&p.y<ROAD&&p.y>ROAD-300?lighthouse:null);
  if(hit){ const d=Math.hypot(hit.x-hero.x,hit.y+40-hero.y); if(d<110){ openFrame(hit); return; } hero.tx=hit.x; hero.ty=hit.y+40; hero.goal=hit; return; }
  hero.tx=p.x; hero.ty=p.y; hero.goal=null;
});

/* ---------- the frame (detail panel) ---------- */
const $=id=>document.getElementById(id);
let frameOpen=null, journalOpen=false, near=null;
const KIND={update:["Update","k-update"],bug:["Bug","k-bug"],invest:["Investor","k-invest"],frame:["Frame · Hindsight Hall","k-frame"],final:["The end of the road","k-final"]};
function para(txt){ const p=document.createElement("p"); p.textContent=txt; return p; }
function openFrame(o){
  frameOpen=o; const [k,c]=KIND[o.kind]; $("fKind").textContent=k; $("fKind").className="kind "+c;
  $("fTitle").textContent=o.title; const b=$("fBody"); b.innerHTML="";
  const meta=[fmtD(o.d),o.tag].filter(Boolean).join(" · ");
  $("fMeta").textContent=meta;
  if(o.kind==="update"&&o.why) b.append(para("Why: "+o.why));
  if(o.kind==="bug"){ b.append(para("Reached the phone? "+(o.reached||"not recorded"))); if(o.fix) b.append(para("Cause → fix: "+o.fix)); }
  if(o.kind==="frame"||o.kind==="final") b.append(para(o.body||""));
  if(o.kind==="final"){ const nU=items.filter(i=>i.kind==="update").length,nB=items.filter(i=>i.kind==="bug").length,nI=items.filter(i=>i.kind==="invest").length; const s=countable.filter(q=>seen.has(q.id)).length; b.append(para(`On this road: ${nU} updates · ${nB} bugs · ${nI} investor notes · ${frames.length} frames.\nYou've looked at ${s} of ${countable.length}.`)); }
  if(o.src){ const a=document.createElement("a"); a.href=o.src; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent="Source: "+o.src; const p=document.createElement("p"); p.append(a); b.append(p); }
  $("frame").style.display="block"; $("prompt").style.display="none";
  if(!seen.has(o.id)){ seen.add(o.id); saveSeen(); updCount(); if(countable.every(q=>seen.has(q.id))) toast("Everything looked at. Nothing missed. 🐔"); }
}
function closeFrame(){ frameOpen=null; $("frame").style.display="none"; }
function stepFrame(dir){ if(!frameOpen) return; const seq=[...frames,...items,lighthouse]; let i=seq.indexOf(frameOpen)+dir; if(i<0||i>=seq.length) return; const o=seq[i]; hero.x=o.x; hero.y=o.y+48; hero.tx=null; openFrame(o); }
$("fClose").onclick=closeFrame; $("fPrev").onclick=()=>stepFrame(-1); $("fNext").onclick=()=>stepFrame(1);
$("prompt").onclick=()=>near&&openFrame(near);

/* ---------- the journal: everything, ticked as you see it ---------- */
let jf="all";
function openJournal(){ closeFrame(); journalOpen=true; $("journal").style.display="flex"; drawJournal(); }
function closeJournal(){ journalOpen=false; $("journal").style.display="none"; }
function drawJournal(){
  const L=$("jList"); L.innerHTML="";
  [...frames,...items,lighthouse].filter(o=>jf==="all"||(jf==="unseen"?!seen.has(o.id):o.kind===jf)).forEach(o=>{
    const r=document.createElement("div"); r.className="it";
    const d=document.createElement("span"); d.className="d"; d.textContent=o.d?fmtD(o.d).replace(/ \d{4}$/,""):"—";
    const t=document.createElement("span"); t.textContent=o.title; t.className=KIND[o.kind][1];
    const s=document.createElement("span"); s.className="s"; s.textContent=seen.has(o.id)?"✓ seen":"·";
    r.append(d,t,s); r.onclick=()=>{ closeJournal(); hero.x=o.x; hero.y=o.y+48; hero.tx=null; cam.x=hero.x; cam.y=hero.y; openFrame(o); };
    L.append(r);
  });
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); b.classList.add("on"); jf=b.dataset.f; drawJournal(); });
$("jbtn").onclick=openJournal; $("seen").onclick=openJournal; $("jClose").onclick=closeJournal;
function toast(t){ const el=$("toast"); el.textContent=t; el.style.opacity=1; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.opacity=0,2600); }

/* ---------- gossip: hens talk about what's nearby ---------- */
function gossip(h){
  const close=items.filter(i=>Math.abs(i.x-h.x)<260); if(!close.length) return "";
  const o=close[Math.floor(rnd()*close.length)];
  const short=o.title.length>34?o.title.slice(0,32)+"…":o.title;
  if(o.kind==="bug") return seen.has(o.id)?"Squashed: "+short:"Bug over there!";
  if(o.kind==="invest") return "Market says: "+short;
  return ["Remember "+short+"?","In hindsight… "+short,"Bok! "+short][Math.floor(rnd()*3)];
}

/* ---------- time ---------- */
let T=0, last=performance.now();
const DAYLEN=180; // seconds for a full day
function light(){ const p=(T/DAYLEN)%1; return 0.5+0.5*Math.cos((p-0.25)*Math.PI*2)*-1; } // 0 night .. 1 noon
function update(dt){
  T+=dt;
  // hero
  let mx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0), my=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(frameOpen||journalOpen){ mx=my=0; }
  if(mx||my){ hero.tx=null; hero.goal=null; }
  else if(hero.tx!==null){ const dx=hero.tx-hero.x, dy=hero.ty-hero.y, d=Math.hypot(dx,dy); if(d<6){ hero.tx=null; if(hero.goal){ openFrame(hero.goal); hero.goal=null; } } else { mx=dx/d; my=dy/d; } }
  const sp=(keys.shift?420:240);
  const m=Math.hypot(mx,my)||1;
  if(mx||my){ hero.x+=mx/m*sp*dt; hero.y+=my/m*sp*dt; hero.step+=dt*12; if(mx) hero.dir=mx>0?1:-1; }
  hero.x=Math.max(HALL_X-320,Math.min(END_X+200,hero.x)); hero.y=Math.max(ROAD-560,Math.min(ROAD+520,hero.y));
  cam.x+=(hero.x-cam.x)*Math.min(1,dt*5); cam.y+=(hero.y-cam.y)*Math.min(1,dt*5);
  // nearest thing to look at
  near=null; let best=100;
  for(const o of all){ const d=Math.hypot(o.x-hero.x,(o.y+40)-hero.y); if(d<best){best=d;near=o;} }
  const pr=$("prompt");
  if(near&&!frameOpen&&!journalOpen){ pr.style.display="block"; pr.textContent=(seen.has(near.id)?"✓ ":"👁 ")+"Look: "+near.title+"  (E / tap)"; } else pr.style.display="none";
  // hens
  for(const h of hens){
    h.wait-=dt; h.sayT-=dt;
    const dx=h.tx-h.x, dy=h.ty-h.y, d=Math.hypot(dx,dy);
    if(d>4&&h.wait<=0){ h.x+=dx/d*60*dt; h.y+=dy/d*60*dt; h.step+=dt*10; h.dir=dx>0?1:-1; h.peck=0; }
    else { h.peck+=dt; if(h.wait<=0){ h.wait=1+rnd()*5; h.tx=Math.max(HALL_X,Math.min(END_X,h.x+(rnd()*2-1)*260)); h.ty=ROAD+(rnd()*2-1)*120; if(rnd()<.35&&Math.abs(h.x-hero.x)<VW){ h.say=gossip(h); h.sayT=3.2; } } }
    // follow the hero a little when close: chickens are curious
    if(Math.hypot(hero.x-h.x,hero.y-h.y)<90&&rnd()<.01){ h.tx=hero.x+(rnd()*2-1)*60; h.ty=hero.y+(rnd()*2-1)*40; }
  }
  // bugs: wander around their burrow; seen bugs slow down and settle
  for(const it of items) if(it.kind==="bug"){
    it.t+=dt; const s=seen.has(it.id)?0.15:1;
    it.x=it.home.x+Math.sin(it.t*0.7+it.seed*9)*28*s; it.y=it.home.y+Math.cos(it.t*0.9+it.seed*5)*16*s;
  }
  for(const c of clouds){ c.x+=c.v*dt; if(c.x>END_X+900) c.x=HALL_X-900; }
  $("clock").textContent=(light()>0.35?"☀︎ Day":"☾ Night");
}

/* ---------- drawing ---------- */
function lerpC(a,b,t){ return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function ell(x,y,rx,ry,c){ cx.fillStyle=c; cx.beginPath(); cx.ellipse(x,y,rx,ry,0,0,Math.PI*2); cx.fill(); }
function rr(x,y,w,h,r,c){ cx.fillStyle=c; cx.beginPath(); cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h); cx.fill(); }
function chicken(x,y,dir,step,peck,col,scale=1,crown=false){
  cx.save(); cx.translate(x,y); cx.scale(dir*scale,scale);
  const bob=Math.sin(step)*1.5, pk=peck>0?Math.max(0,Math.sin(peck*7))*6:0;
  cx.strokeStyle="#d08a1e"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(-3,6); cx.lineTo(-3-Math.sin(step)*4,16); cx.moveTo(4,6); cx.lineTo(4+Math.sin(step)*4,16); cx.stroke();
  ell(0,bob,13,10,col); ell(-11,bob-4,6,7,col); // body, tail
  ell(9,bob-10+pk,7,7,col); // head
  cx.fillStyle="#e0a020"; cx.beginPath(); cx.moveTo(15,bob-10+pk); cx.lineTo(21,bob-8+pk); cx.lineTo(15,bob-6+pk); cx.fill();
  ell(10,bob-17+pk,4,3,"#d23b2a"); ell(14,bob-4+pk,2,3,"#d23b2a");
  ell(11,bob-11+pk,1.4,1.4,"#111");
  if(crown){ cx.fillStyle="#e6b422"; cx.beginPath(); cx.moveTo(4,bob-20+pk); cx.lineTo(6,bob-28+pk); cx.lineTo(9,bob-22+pk); cx.lineTo(12,bob-29+pk); cx.lineTo(14,bob-21+pk); cx.fill(); }
  cx.restore();
}
function house(o,L){
  const h=o.hue, s=o.seed, w=64+s*18, ht=46+s*20;
  ell(o.x,o.y+4,w/2+6,7,"#0002");
  rr(o.x-w/2,o.y-ht,w,ht,3,`hsl(${h},35%,${60+s*12}%)`);
  cx.fillStyle=`hsl(${h},45%,${30+s*8}%)`; cx.beginPath(); cx.moveTo(o.x-w/2-8,o.y-ht); cx.lineTo(o.x,o.y-ht-30-s*14); cx.lineTo(o.x+w/2+8,o.y-ht); cx.fill();
  const lit=L<0.4; const win=lit?`rgba(255,${200+Math.sin(T*3+s*9)*20},110,0.95)`:"#9cc7d8";
  rr(o.x-w/2+8,o.y-ht+10,14,12,2,win); rr(o.x+w/2-22,o.y-ht+10,14,12,2,win);
  rr(o.x-7,o.y-22,14,22,2,"#5a3b22");
  if(lit){ cx.fillStyle="rgba(255,210,120,0.10)"; cx.beginPath(); cx.arc(o.x,o.y-ht/2,70,0,7); cx.fill(); }
  // version flag
  cx.strokeStyle="#5a3b22"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(o.x+w/2-4,o.y-ht); cx.lineTo(o.x+w/2-4,o.y-ht-26); cx.stroke();
  const flap=Math.sin(T*4+s*7)*3; cx.fillStyle=seen.has(o.id)?"#2f7a55":"#c9932f"; cx.beginPath(); cx.moveTo(o.x+w/2-4,o.y-ht-26); cx.lineTo(o.x+w/2+18,o.y-ht-21+flap); cx.lineTo(o.x+w/2-4,o.y-ht-16); cx.fill();
  label(o.tag||"",o.x,o.y+18,"#00000099");
}
function beetle(o){
  const r=o.big?14:9, a=Math.sin(T*8+o.seed*20)*0.4, sq=seen.has(o.id);
  ell(o.x,o.y+3,r+3,4,"#0002");
  cx.save(); cx.translate(o.x,o.y); cx.rotate(Math.sin(o.t*0.7+o.seed*9)*0.6);
  cx.strokeStyle="#222"; cx.lineWidth=1.5; for(let k=-1;k<=1;k++){ cx.beginPath(); cx.moveTo(k*r*.5,0); cx.lineTo(k*r*.5-r*.9,-r*.8+Math.sin(T*14+k)*(sq?0:3)); cx.moveTo(k*r*.5,0); cx.lineTo(k*r*.5+r*.9,r*.8-Math.sin(T*14+k)*(sq?0:3)); cx.stroke(); }
  ell(0,0,r,r*0.8,sq?"#7a8a6a":(o.big?"#b8432f":"#8a3a2a")); ell(r*0.9,0,r*.4,r*.4,"#222");
  cx.strokeStyle="#0006"; cx.beginPath(); cx.moveTo(-r,0); cx.lineTo(r*.6,0); cx.stroke();
  if(!sq){ ell(-r*.3,-r*.3,2,2,"#fff8"); }
  cx.restore();
  if(sq){ cx.fillStyle="#2f7a55"; cx.font="bold 12px Georgia"; cx.fillText("✓",o.x+r+2,o.y-r); }
}
function stall(o){
  const s=o.seed; ell(o.x,o.y+4,34,6,"#0002");
  rr(o.x-28,o.y-30,56,30,3,"#e9dcc0");
  for(let k=0;k<4;k++){ cx.fillStyle=k%2?"#fff":"#2d5f9a"; cx.fillRect(o.x-32+k*16,o.y-46,16,14); }
  cx.fillStyle="#2d5f9a"; cx.font="bold 13px Georgia"; cx.textAlign="center"; cx.fillText(seen.has(o.id)?"✓":"£",o.x,o.y-12); cx.textAlign="left";
  // little ticker dots
  ell(o.x-16,o.y-38+Math.sin(T*3+s*9)*2,2,2,"#ffd34d");
}
function label(t,x,y,c){ if(!t) return; cx.font="11px Georgia"; cx.textAlign="center"; cx.fillStyle=c; cx.fillText(t.length>22?t.slice(0,21)+"…":t,x,y); cx.textAlign="left"; }
function bubble(t,x,y){ cx.font="12px Georgia"; const w=Math.min(220,cx.measureText(t).width+16); rr(x-w/2,y-26,w,20,8,"#fffaf0ee"); cx.fillStyle="#1d1a16"; cx.textAlign="center"; cx.fillText(t.length>34?t.slice(0,33)+"…":t,x,y-12); cx.textAlign="left"; }

function draw(){
  const L=light(), z=zoom();
  const sky=lerpC([26,30,58],[176,214,236],L), grass=lerpC([30,52,38],[132,178,96],L);
  cx.fillStyle=rgb(grass); cx.fillRect(0,0,VW,VH);
  cx.save(); cx.translate(VW/2,VH/2); cx.scale(z,z); cx.translate(-cam.x,-cam.y);
  const vx0=cam.x-VW/2/z-100, vx1=cam.x+VW/2/z+100;
  // the far north is the sky's edge: a river of sky above the market
  cx.fillStyle=rgb(sky); cx.fillRect(vx0,ROAD-1400,vx1-vx0,880);
  for(const c of clouds) if(c.x>vx0-200&&c.x<vx1+200){ ell(c.x,c.y,60*c.s,20*c.s,`rgba(255,255,255,${0.5+L*0.4})`); ell(c.x+30*c.s,c.y-10*c.s,40*c.s,18*c.s,`rgba(255,255,255,${0.5+L*0.4})`); }
  if(L<0.4){ for(let i=0;i<40;i++){ const sx=vx0+((i*997)%(vx1-vx0)), sy=ROAD-1380+((i*463)%600); ell(sx,sy,1.2,1.2,`rgba(255,255,240,${(0.4-L)*2*(0.5+0.5*Math.sin(T*2+i))})`);} }
  // grass tufts
  cx.strokeStyle=rgb(lerpC(grass,[20,40,20],0.35)); cx.lineWidth=1.5;
  for(const g of tufts) if(g.x>vx0&&g.x<vx1){ const sw=Math.sin(T*1.6+g.p)*3; cx.beginPath(); cx.moveTo(g.x,g.y); cx.lineTo(g.x-3+sw,g.y-9); cx.moveTo(g.x+3,g.y); cx.lineTo(g.x+4+sw,g.y-10); cx.stroke(); }
  // market strip
  rr(Math.max(vx0,HALL_X+200),ROAD-430,Math.min(vx1,END_X)-Math.max(vx0,HALL_X+200),70,0,"#00000014");
  // the road
  rr(HALL_X-400,ROAD-22,END_X-HALL_X+700,44,0,rgb(lerpC([70,60,48],[214,190,150],L)));
  cx.strokeStyle="#ffffff55"; cx.setLineDash([18,16]); cx.beginPath(); cx.moveTo(HALL_X-400,ROAD); cx.lineTo(END_X+300,ROAD); cx.stroke(); cx.setLineDash([]);
  // date signposts
  for(const s of signs) if(s.x>vx0&&s.x<vx1){ cx.fillStyle="#5a3b22"; cx.fillRect(s.x-2,ROAD-60,4,40); rr(s.x-38,ROAD-78,76,22,4,"#e9dcc0"); cx.fillStyle="#3a2a18"; cx.font="bold 12px Georgia"; cx.textAlign="center"; cx.fillText(fmtD(s.d).replace(/ \d{4}$/,""),s.x,ROAD-62); cx.textAlign="left"; }
  // Hindsight Hall (the frames gallery)
  if(HALL_X+HALL_W/2+40>vx0&&HALL_X-HALL_W/2-40<vx1){
    rr(HALL_X-HALL_W/2,ROAD-300,HALL_W,250,6,"#efe3c8"); cx.fillStyle="#7c4dab"; cx.beginPath(); cx.moveTo(HALL_X-HALL_W/2-20,ROAD-300); cx.lineTo(HALL_X,ROAD-380); cx.lineTo(HALL_X+HALL_W/2+20,ROAD-300); cx.fill();
    cx.fillStyle="#fff"; cx.font="bold 16px Georgia"; cx.textAlign="center"; cx.fillText("HINDSIGHT HALL",HALL_X,ROAD-316); cx.textAlign="left";
    rr(HALL_X-24,ROAD-90,48,40,3,"#5a3b22");
    if(!frames.length){ label("Frames arrive with the cheat sheet",HALL_X,ROAD-200,"#5a3b22"); }
  }
  for(const f of frames){ const sn=seen.has(f.id); rr(f.x-26,f.y-30,52,42,2,"#8a6a3a"); rr(f.x-21,f.y-25,42,32,1,sn?"#e8e0f2":"#c9b7e0"); cx.fillStyle="#3a2a18"; cx.font="bold 10px Georgia"; cx.textAlign="center"; cx.fillText(String(f.i+1),f.x,f.y-5); cx.textAlign="left"; if(sn){ cx.fillStyle="#2f7a55"; cx.fillText("✓",f.x+16,f.y-18); } }
  // lighthouse
  if(lighthouse.x>vx0-200&&lighthouse.x<vx1+200){ const lx=lighthouse.x, ly=ROAD-40;
    cx.fillStyle="#f4efe6"; cx.beginPath(); cx.moveTo(lx-34,ly); cx.lineTo(lx-20,ly-220); cx.lineTo(lx+20,ly-220); cx.lineTo(lx+34,ly); cx.fill();
    for(let k=0;k<4;k++){ cx.fillStyle="#b8432f"; cx.beginPath(); const y0=ly-30-k*50; cx.moveTo(lx-32+k*3.5,y0); cx.lineTo(lx-28+k*3.5,y0-22); cx.lineTo(lx+28-k*3.5,y0-22); cx.lineTo(lx+32-k*3.5,y0); cx.fill(); }
    rr(lx-24,ly-250,48,30,4,"#2b2b2b"); ell(lx,ly-236,10,10,"#ffd34d");
    const a=T*0.8; cx.fillStyle=`rgba(255,220,120,${0.15+(1-L)*0.35})`; cx.beginPath(); cx.moveTo(lx,ly-236); cx.lineTo(lx+Math.cos(a)*700,ly-236+Math.sin(a)*120-60); cx.lineTo(lx+Math.cos(a)*700,ly-236+Math.sin(a)*120+60); cx.fill();
    label(lighthouse.title.toUpperCase(),lx,ly+18,"#3a2a18");
  }
  // things, back to front
  const vis=items.filter(o=>o.x>vx0&&o.x<vx1);
  const draws=[...vis.map(o=>({y:o.y,f:()=>o.kind==="update"?house(o,L):o.kind==="bug"?beetle(o):stall(o)})),
               ...hens.filter(h=>h.x>vx0&&h.x<vx1).map(h=>({y:h.y,f:()=>{ chicken(h.x,h.y,h.dir,h.step,h.peck,h.col); if(h.sayT>0&&h.say) bubble(h.say,h.x,h.y-28); }})),
               {y:hero.y,f:()=>chicken(hero.x,hero.y,hero.dir,hero.step,0,"#fff6e0",1.35,true)}];
  draws.sort((a,b)=>a.y-b.y).forEach(d=>d.f());
  // butterflies by day, fireflies by night
  for(const f of flies) if(f.x>vx0&&f.x<vx1){ const fx=f.x+Math.sin(T*0.7+f.p)*60, fy=f.y+Math.cos(T*1.1+f.p)*30;
    if(L>0.4){ const w=Math.abs(Math.sin(T*12+f.p))*5; cx.fillStyle=["#f7c948","#e86a92","#8fd3ff"][Math.floor(f.p)%3]; cx.beginPath(); cx.ellipse(fx-2,fy,w,3,0,0,7); cx.ellipse(fx+2,fy,w,3,0,0,7); cx.fill(); }
    else ell(fx,fy,2.2,2.2,`rgba(220,255,120,${0.5+0.5*Math.sin(T*4+f.p)})`); }
  // highlight what's near
  if(near&&!frameOpen){ cx.strokeStyle="#c9932f"; cx.lineWidth=2; cx.setLineDash([5,5]); cx.beginPath(); cx.ellipse(near.x,near.y+2,44,14,0,0,7); cx.stroke(); cx.setLineDash([]); }
  if(hero.tx!==null){ cx.strokeStyle="#ffffffaa"; cx.beginPath(); cx.arc(hero.tx,hero.ty,8+Math.sin(T*8)*2,0,7); cx.stroke(); }
  cx.restore();
  // night tint
  if(L<0.5){ cx.fillStyle=`rgba(10,14,40,${(0.5-L)*0.7})`; cx.fillRect(0,0,VW,VH); }
  // timeline strip: where you are, what's left
  const y=VH-28, x0=16, x1=VW-16; rr(x0,y-6,x1-x0,12,6,"#00000033");
  const span=END_X-HALL_X, px=v=>x0+(v-HALL_X)/span*(x1-x0);
  for(const o of all){ cx.fillStyle=seen.has(o.id)?"#2f7a55":o.kind==="bug"?"#b8432f":o.kind==="invest"?"#2d5f9a":o.kind==="frame"?"#7c4dab":"#c9932f"; cx.fillRect(px(o.x)-1,y-4,2,8); }
  ell(px(hero.x),y,6,6,"#fff"); ell(px(hero.x),y,3,3,"#d23b2a");
}

function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
setTimeout(()=>toast("Walk with arrows/WASD or tap. Look at everything."),400);
window.__hindsight={W,items,frames,all,seen,hero,openFrame};
})();
</script>
